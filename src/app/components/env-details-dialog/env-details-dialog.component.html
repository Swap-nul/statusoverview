<h1 mat-dialog-title class="dialog-title">
  <mat-icon svgIcon="env"></mat-icon>
  <span><b><i>{{ envName }}</i></b> Details</span>
</h1>

<mat-dialog-content class="dialog-content mat-typography">
  <div class="table-shell">
    <table mat-table [dataSource]="dataSource" class="env-table">
      <ng-container matColumnDef="position">
        <th mat-header-cell *matHeaderCellDef>No.</th>
        <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let element">{{ element.appName || "--" }}</td>
      </ng-container>

      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let element">
          <span class="type-cell">
            <mat-icon *ngIf="element?.appType === ''" svgIcon="app"></mat-icon>
            <mat-icon *ngIf="element?.appType === 'Spring'" svgIcon="springio"></mat-icon>
            <mat-icon *ngIf="element?.appType === 'Mule'" svgIcon="mulesoft"></mat-icon>
            <mat-icon *ngIf="element?.appType === 'ShellScript'" svgIcon="shellscript"></mat-icon>
            <mat-icon *ngIf="element?.appType === 'Python'" svgIcon="python"></mat-icon>
            <mat-icon *ngIf="element?.appType === 'NodeJS'" svgIcon="nodejs"></mat-icon>
            <mat-icon *ngIf="element?.appType === 'PowerShell'" svgIcon="powershell"></mat-icon>
            <mat-icon *ngIf="element?.appType === 'React'" svgIcon="react"></mat-icon>
            <mat-icon *ngIf="element?.appType === 'DotNet'" svgIcon="dotnet"></mat-icon>
            <span>{{ element?.appType || "--" }}</span>
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="url">
        <th mat-header-cell *matHeaderCellDef>URL</th>
        <td mat-cell *matCellDef="let element">
          <div class="url-cell">
            <span class="url-text">{{ element?.url || "--" }}</span>
            <button mat-icon-button *ngIf="element?.url" (click)="copyToClipboard(element.url!)" matTooltip="Copy URL">
              <mat-icon svgIcon="copyToClipboard"></mat-icon>
            </button>
            <button mat-icon-button *ngIf="element?.url" (click)="goToLink(element.url)" matTooltip="Open in new tab">
              <mat-icon svgIcon="externalLink"></mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-flat-button mat-dialog-close class="close-btn">
    <mat-icon svgIcon="close"></mat-icon>
    Close
  </button>
</mat-dialog-actions>

<mat-toolbar class="custom-mat-toolbar">
  <div class="toolbar-brand">
    <img src="../../../assets/images/SO-logo.png" class="logo" alt="Status Overview logo" />
    <div class="brand-copy">
      <div class="brand-title">Service Matrix</div>
      <div class="brand-subtitle">Live deployment overview</div>
    </div>
  </div>

  <div class="toolbar-actions">
    <a
      href="https://github.com/swapnil512/statusoverview"
      target="_blank"
      rel="noopener noreferrer"
      title="Go to repository"
      class="repo-link">
      <mat-icon svgIcon="github_repo"></mat-icon>
      <span>GitHub</span>
    </a>

    <button
      mat-raised-button
      color="accent"
      (click)="toggleDashboardView()"
      class="release-calendar-toggle-btn"
      [matTooltip]="currentView === 'calendar' ? 'Return to the project tabs' : 'Show the global release calendar for all projects'">
      <mat-icon>{{ currentView === 'calendar' ? 'dashboard' : 'calendar_month' }}</mat-icon>
      {{ currentView === 'calendar' ? 'Projects View' : 'Release Calendar' }}
    </button>

    <div class="auth-section" *ngIf="isAuthenticated">
      <span class="username">{{ username }}</span>
      <span class="provider-badge" *ngIf="authProvider">({{ getProviderDisplayName() }})</span>
      <button mat-icon-button [matMenuTriggerFor]="userMenu" class="user-menu-btn" aria-label="Open user menu">
        <mat-icon svgIcon="account"></mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <div class="user-info-header" mat-menu-item disabled>
          <strong>{{ username }}</strong>
          <br />
          <small>{{ userInfo?.email }}</small>
          <br />
          <small class="provider-info">Authenticated via {{ getProviderDisplayName() }}</small>
        </div>
        <mat-divider></mat-divider>

        <button mat-menu-item (click)="goToAccountManagement()" *ngIf="authProvider === 'keycloak'">
          <mat-icon svgIcon="account-settings"></mat-icon>
          <span>Keycloak Portal</span>
        </button>

        <button mat-menu-item (click)="goToAccountManagement()" *ngIf="authProvider === 'azure'">
          <mat-icon svgIcon="account-settings"></mat-icon>
          <span>Azure Portal</span>
        </button>

        <button mat-menu-item (click)="logout()">
          <mat-icon svgIcon="logout"></mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </div>
  </div>
</mat-toolbar>
